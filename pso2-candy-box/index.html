  <dialog id="saveDialog"><form id="saveForm"><div class="dialog-heading"><h2>保存到我的预设</h2><button type="button" data-close aria-label="关闭">×</button></div><label>预设名称<input id="presetName" required maxlength="100" autocomplete="off"></label><label>备注<textarea id="presetNote" rows="4" maxlength="3000"></textarea></label><p class="muted">保存糖果位置、压缩阶段、等级、属性与障碍状态。</p><div class="dialog-actions"><button type="button" data-close>取消</button><button id="saveCopy" type="button">另存一份</button><button type="submit" class="primary" id="saveConfirm">保存</button></div></form></dialog>
  <dialog id="importDialog"><div class="dialog-heading"><h2>导入备份</h2><button data-close aria-label="关闭">×</button></div><p id="importSummary"></p><p class="muted">合并会保留现有预设，导入的同名预设会自动加上编号。替换会先下载一份现有预设备份。</p><div class="dialog-actions"><button data-close>取消</button><button id="replaceImport">备份并替换全部</button><button id="mergeImport" class="primary">合并导入</button></div></dialog>
  <dialog id="confirmDialog"><div class="dialog-heading"><h2 id="confirmTitle"></h2><button data-close aria-label="关闭">×</button></div><p id="confirmMessage"></p><div class="dialog-actions"><button data-close>取消</button><button id="confirmAction" class="primary">确定</button></div></dialog>
</body></html>
