<script>
(()=>{
  const key='simulator-hub-theme';
  const choices=['system','light','dark'];
  const media=matchMedia('(prefers-color-scheme: dark)');
  const languageKey='simulator-hub-language';
  const translations={en:{"title": "ARKS NEXUS", "theme": "Theme", "system": "System", "light": "Light", "dark": "Dark", "language": "Language", "skip": "Skip to simulators", "list": "Simulators", "equipment": "Equipment Simulator", "affix": "Augmentation Simulator", "skills": "Skill Simulator", "candy": "Candy Box Simulator", "open": "Open in a new tab"},
    zh:{title:'ARKS NEXUS',theme:'主题',system:'跟随系统',light:'浅色',dark:'深色',language:'语言',skip:'跳到模拟器列表',list:'模拟器列表',equipment:'配装模拟器',affix:'追加模拟器',skills:'加点模拟器',candy:'糖果盒模拟器',open:'在新标签页打开'},
    ja:{title:'ARKS NEXUS',theme:'テーマ',system:'システム',light:'ライト',dark:'ダーク',language:'言語',skip:'シミュレーター一覧へ',list:'シミュレーター一覧',equipment:'装備シミュレーター',affix:'特殊能力追加シミュレーター',skills:'スキルシミュレーター',candy:'キャンディーボックスシミュレーター',open:'新しいタブで開く'}
  };
  let choice='system';
  let language='ja';
  try{const stored=localStorage.getItem(key);if(choices.includes(stored))choice=stored}catch{}
  try{const stored=localStorage.getItem(languageKey);if(Object.hasOwn(translations,stored))language=stored}catch{}
  function apply(){document.documentElement.dataset.theme=choice==='system'?(media.matches?'dark':'light'):choice}
  function translate(){
    const text=translations[language];
    document.documentElement.lang=language==='ja'?'ja':language==='en'?'en':'zh-CN';
    document.querySelectorAll('[data-i18n]').forEach(element=>{element.textContent=text[element.dataset.i18n]});
    document.querySelector('#simulators').setAttribute('aria-label',text.list);
    document.querySelectorAll('.simulator').forEach(link=>{
      const name=link.querySelector('.game').textContent+text[link.querySelector('[data-i18n]').dataset.i18n];
      link.setAttribute('aria-label',name+' — '+text.open);
    });
  }
  apply();
  media.addEventListener('change',()=>{if(choice==='system')apply()});
  document.addEventListener('DOMContentLoaded',()=>{
    const select=document.querySelector('#theme');
    const languageSelect=document.querySelector('#language');
    select.value=choice;
    languageSelect.value=language;
    translate();
    select.addEventListener('change',()=>{
      choice=choices.includes(select.value)?select.value:'system';
      apply();
      try{localStorage.setItem(key,choice)}catch{}
    });
    languageSelect.addEventListener('change',()=>{
      language=Object.hasOwn(translations,languageSelect.value)?languageSelect.value:'ja';
      translate();
      try{localStorage.setItem(languageKey,language)}catch{}
    });
  },{once:true});
})();
</script>
<style>
:root{color-scheme:light;--bg:#c3ced7;--panel:#e8eff3;--text:#273943;--muted:#4c6473;--line:#a8bbc9;--hover:#e8f1f680;--selected:#e8f1f6cc;--focus:#305e72;--pattern:url("backgrounds/rappy-pattern-light.svg");font-family:Arial,"Microsoft YaHei","Meiryo",sans-serif}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10171f;--panel:#18242f;--text:#e2ebf0;--muted:#a9bdcc;--line:#3e5566;--hover:#30495b80;--selected:#30495bcc;--focus:#91cbe9;--pattern:url("backgrounds/rappy-pattern-dark.svg")}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background-color:var(--bg);background-image:var(--pattern);background-size:220px 220px;color:var(--text);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:fixed;left:16px;top:12px;transform:translateY(-180%);padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:5px;z-index:2}
.skip:focus{transform:none}
.app-header{min-height:52px;background:var(--panel);border-bottom:1px solid var(--line)}
.header-inner{max-width:1328px;min-height:51px;margin:auto;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}.brand-copy{min-width:0}
.brand h1{margin:0;font-size:16px;line-height:20px;letter-spacing:-.03em;font-weight:700}
.byline{margin:2px 0 0;font-size:9px;line-height:12px;color:var(--muted)}
.controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
.theme-control{display:flex;align-items:center;gap:7px;flex-shrink:0;color:var(--muted);font-size:10.5px;line-height:16px}
.theme-control select{width:112px;height:26px;min-height:26px;padding:4px 8px;font:inherit;border:1px solid var(--line);border-radius:5px;background:#fff;color:#273943;cursor:pointer}
:root[data-theme="dark"] .theme-control select{background:var(--panel);color:var(--text)}
.desktop{flex:1;width:100%;max-width:1328px;margin:0 auto;padding:24px 16px}
.simulators{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,112px));gap:12px 16px;align-items:stretch;list-style:none;margin:0;padding:0}
.simulator{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:144px;height:100%;padding:12px 6px 10px;border:1px solid transparent;border-radius:5px;text-align:center;transition:background 140ms ease,border-color 140ms ease}
.simulator:hover{background:var(--hover);border-color:var(--line)}
.simulator:active,.simulator:focus-visible{background:var(--selected);border-color:var(--focus)}
.simulator img{display:block;width:64px;height:64px;flex-shrink:0;border-radius:5px}
.simulator span{font-size:13px;line-height:20px;overflow-wrap:anywhere}.game{display:block}
.sim-copyright{width:100%;max-width:1328px;margin:0 auto;padding:8px 24px 16px;font-size:11px;line-height:16px;color:var(--muted)}
@media(max-width:700px){.header-inner{padding:7px 8px;flex-wrap:wrap;gap:10px}.brand{flex:1 1 250px}.desktop{padding:20px 12px}.simulators{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 8px}.sim-copyright{padding-left:16px}}
@media(prefers-reduced-motion:reduce){.simulator{transition:none}}
</style>
<style id="app-title-icon">body>header .app-brand{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:8px;min-width:0}body>header .brand-copy{min-width:0}body>header .app-title-icon{display:block;width:32px;height:32px;flex:0 0 32px;object-fit:contain;border-radius:3px}body>header .brand-title{display:flex;align-items:center;gap:8px;min-width:0;min-height:20px}body>header .app-brand .byline,body>header .app-brand .brand-author,body>header .app-brand .brand-sub,body>header .app-brand .sub{display:block;font-size:9px;line-height:12px;margin:2px 0 0;color:var(--muted);opacity:1}</style></head>
